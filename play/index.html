<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bag Ninja Playtest</title>
    <link rel="stylesheet" href="./game.css">
  </head>
  <body>
    <main class="app">
      <section class="shell">
        <header class="panel header-panel">
          <div>
            <h1>Bag Ninja</h1>
            <p>Playable vertical slice for level loading, movement, mowing, and runtime moveable-item interactions.</p>
          </div>
          <div class="toolbar">
            <button id="load-default" type="button">Load Default Level</button>
            <input id="default-file-input" type="file" accept=".json,application/json" hidden>
            <label class="file-button">
              <span>Import Level JSON</span>
              <input id="level-file-input" type="file" accept=".json,application/json">
            </label>
            <button id="restart-level" type="button">Restart Level</button>
          </div>
        </header>

        <section class="panel status-panel">
          <div class="stats">
            <span><strong>State:</strong> <span id="player-state">On Foot</span></span>
            <span><strong>Curtis:</strong> <span id="curtis-state">-</span></span>
            <span><strong>Mowed:</strong> <span id="mowed-count">0 / 0</span></span>
            <span id="mower-fill-stat" hidden><strong>Mower:</strong> <span id="mower-fill-text">0 / 0</span></span>
          </div>
          <div id="mower-fill-meter" class="meter-block" hidden>
            <span class="meter-label">Mower Fill</span>
            <div class="meter-track" aria-hidden="true">
              <div id="mower-fill-bar" class="meter-fill"></div>
            </div>
          </div>
          <p id="load-status" class="load-status"></p>
        </section>

        <section class="play-area">
          <div id="canvas-frame" class="canvas-frame">
            <canvas id="game-canvas" aria-label="Bag Ninja gameplay area"></canvas>
          </div>
          <div class="touch-controls" aria-label="Touch controls">
            <div class="touch-cluster touch-cluster-left">
              <div
                id="joystick"
                class="joystick"
                aria-label="Movement joystick"
                role="application"
              >
                <span class="joystick-arrow joystick-arrow-up" aria-hidden="true"></span>
                <span class="joystick-arrow joystick-arrow-right" aria-hidden="true"></span>
                <span class="joystick-arrow joystick-arrow-down" aria-hidden="true"></span>
                <span class="joystick-arrow joystick-arrow-left" aria-hidden="true"></span>
                <span id="joystick-knob" class="joystick-knob" aria-hidden="true"></span>
              </div>
            </div>
            <div class="touch-cluster touch-cluster-right">
              <button id="action-button" class="action-button" type="button" aria-label="Action"></button>
            </div>
          </div>
        </section>

        <section id="game-over-overlay" class="game-over-overlay" aria-hidden="true">
          <div class="game-over-card">
            <h2>Game Over</h2>
            <p>Police caught Bag Ninja in the act.</p>
            <p class="game-over-scene">[ Policeman handcuffing Bag Ninja ]</p>
          </div>
        </section>
      </section>
    </main>

    <script src="./game-core.js?v=20260616-2"></script>
    <script src="./game.js?v=20260616-2"></script>
  </body>
</html>
